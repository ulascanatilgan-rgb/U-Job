<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f3f4f6">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="U-Job">
  <title>U-Job</title>
  <link rel="manifest" href="/manifest.webmanifest?v=43">
  <link rel="icon" href="/icon.svg?v=43" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/icon.svg?v=43">
  <link rel="stylesheet" href="/styles.css?v=43">
</head>
<body data-mode="reasonable">
  <main class="shell">
    <header class="topbar">
      <div class="brand-center">
        <div class="brand-mark" aria-label="U Job">
          <span class="brand-glyph">U<span class="brand-signal"></span></span>
          <span class="brand-word">JOB</span>
        </div>
        <div id="todayDate" class="today-date"></div>
      </div>
      <div id="lastUpdate" class="last-update"></div>
    </header>
    <nav class="modes" aria-label="Job search modes">
      <button class="mode reasonable active" data-mode="reasonable">Reasonable</button>
      <button class="mode creative" data-mode="creative">Creative</button>
      <button class="mode corporate" data-mode="corporate">Corporate</button>
      <button class="mode fintech" data-mode="fintech">Fintech</button>
      <button class="mode ai" data-mode="ai">AI</button>
      <button class="mode linkedin" data-mode="linkedin">LinkedIn</button>
      <button class="mode global" data-mode="global">Global</button>
      <button class="mode swmo" data-mode="swmo">SW-MO</button>
      <button class="mode prestige" data-mode="prestige">Prestige</button>
      <button class="mode highpaid" data-mode="highpaid">High Paid</button>
      <button class="mode turkish" data-mode="turkish">Turkish</button>
    </nav>
    <div class="utility-row">
      <button id="actionsMode" class="actions-mode" type="button">
        <span>Watchlist</span><span id="actionsCount">0</span>
      </button>
      <button id="askButton" class="ask-inline" type="button" aria-controls="askPanel" aria-expanded="false" title="Analyze external job" aria-label="Ask about an external job">Ask</button>
    </div>
    <section class="control-row">
      <div>
        <h1 id="sectionTitle">Reasonable</h1>
        <p id="sectionHint">Balanced, dynamic next step.</p>
      </div>
      <button id="runButton" class="run">Run</button>
    </section>
    <div id="status" class="status" aria-live="polite"></div>
    <section id="results" class="results"></section>
    <section class="history-wrap">
      <button id="historyToggle" class="history-toggle" aria-expanded="false">
        <span>History</span><span id="historyCount">0</span>
      </button>
      <div id="history" class="history" hidden></div>
    </section>
  </main>
  <aside id="askPanel" class="ask-panel" hidden aria-label="Ask about a job vacancy">
    <div class="ask-panel-head">
      <div>
        <div class="ask-kicker">External vacancy</div>
        <h2>Ask</h2>
      </div>
      <button id="askClose" class="ask-close" type="button" aria-label="Close Ask">×</button>
    </div>
    <div class="ask-input-row">
      <input id="askUrl" class="ask-url" type="url" inputmode="url" autocomplete="off" placeholder="Paste a job vacancy link">
      <button id="askRun" class="ask-run" type="button">Analyze</button>
    </div>
    <section id="askResult" class="ask-result" aria-live="polite"></section>
    <div class="ask-history-head"><span>History</span></div>
    <section id="askHistory" class="ask-history"></section>
  </aside>
  <script>
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.getRegistrations().then(regs => regs.forEach(reg => reg.unregister())).catch(() => {});
    }
    if ("caches" in window) {
      caches.keys().then(keys => Promise.all(keys.map(key => caches.delete(key)))).catch(() => {});
    }
  </script>
  <script type="module" src="/app.js?v=43"></script>
</body>
</html>
